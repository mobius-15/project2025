<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>formの学習</title>
</head>
<body>
  <form action="FormServlet" method="post">
    <label for="name">名前：</label>
    <input id="name" type="text" name="name"><br>
    
    <label>性別：</label>
    <label>男：<input type="radio" name="gender" value="0"></label>
    <label>女：<input type="radio" name="gender" value="1" checked="checked"></label><br>
    
    <label for="age">年齢：</label>
    <input id="age" type="number" min="0" max="120" name="age"><br>
    
    <label>お住まい：</label>
    <select name="address">
    	<option value="tokyo">東京都</option>
    	<option value="kanagawa">神奈川県</option>
    	<option value="saitama">埼玉県</option>
    	<option value="tiba">千葉県</option>
    	<option value="other">その他</option>
    </select><br>
    
    <label for="message">ご意見：</label><br>
    <textarea id="message" name="message" cols="40" rows="4">
    </textarea><br>
    
    <input type="submit" value="送信">
  </form>
</body>
</html>
